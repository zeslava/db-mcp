[package]
name = "db-mcp"
version = "0.6.0"
edition = "2024"

[features]
default = ["sqlite", "clickhouse-native"]
sqlite = ["dep:rusqlite"]
clickhouse-native = [
    "dep:klickhouse",
    "dep:chrono",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]

[dependencies]
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
klickhouse = { version = "0.15", features = ["tls"], optional = true }
chrono = { version = "0.4", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mysql", "clickhouse"] }
rmcp = { version = "1.5", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
